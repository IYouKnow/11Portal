services:
  portal:
    image: ghcr.io/iyouknow/portal:latest
    restart: unless-stopped
    depends_on:
      chromium:
        condition: service_started
      guacamole:
        condition: service_started
      guacd:
        condition: service_started
      guacamole-db:
        condition: service_healthy
    environment:
      - PORTAL_ADMIN_EMAIL=${PORTAL_ADMIN_EMAIL-admin@portal.local}
      - PORTAL_ADMIN_PASSWORD=${PORTAL_ADMIN_PASSWORD-change-me-now}
      - PORTAL_DB_PATH=/app/data/portal.db
      - PORTAL_HTTP_ADDR=:8080
      - PORTAL_SESSION_COOKIE_NAME=portal_session
      - PORTAL_SESSION_TTL_HOURS=24
      - PORTAL_SHELL=/bin/sh
      - PORTAL_WORKSPACES_ROOT=/workspaces
      - PORTAL_WEB_ROOT=/app/public
      - PORTAL_PUBLIC_URL=${PORTAL_PUBLIC_URL-http://localhost:38480}
      - PORTAL_FRONTEND_ORIGIN=${PORTAL_FRONTEND_ORIGIN-http://localhost:38480}
      - PORTAL_CHROMIUM_INTERNAL_URL=${PORTAL_CHROMIUM_INTERNAL_URL-https://chromium:3001/chromium}
      - PORTAL_CHROMIUM_PUBLIC_URL=${PORTAL_CHROMIUM_PUBLIC_URL-/chromium/}
      - PORTAL_GUACAMOLE_INTERNAL_URL=${PORTAL_GUACAMOLE_INTERNAL_URL-http://guacamole:8080/guacamole}
      - PORTAL_GUACAMOLE_ADMIN_USERNAME=${PORTAL_GUACAMOLE_ADMIN_USERNAME-portaladmin}
      - PORTAL_GUACAMOLE_ADMIN_PASSWORD=${PORTAL_GUACAMOLE_ADMIN_PASSWORD-change-me-guacadmin}
      - PORTAL_GUACAMOLE_DATA_SOURCE=${PORTAL_GUACAMOLE_DATA_SOURCE-postgresql}
    ports:
      - "38480:8080"
    volumes:
      - ./data:/app/data
      - ./workspaces:/workspaces
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - portal-net

  chromium:
    image: lscr.io/linuxserver/ungoogled-chromium:latest
    restart: unless-stopped
    shm_size: "1gb"
    environment:
      - PUID=${PUID-1000}
      - PGID=${PGID-1000}
      - TZ=${TZ-Etc/UTC}
      - SUBFOLDER=/chromium/
      - TITLE=Portal Chromium
      - SELKIES_UI_TITLE=Portal
      - SELKIES_UI_SHOW_LOGO=false|locked
      - SELKIES_UI_SHOW_SIDEBAR=false|locked
      - SELKIES_UI_SHOW_CORE_BUTTONS=false|locked
      - SELKIES_UI_SIDEBAR_SHOW_KEYBOARD_BUTTON=false|locked
      - SELKIES_ENABLE_SHARING=false|locked
      - SELKIES_GAMEPAD_ENABLED=false|locked
      - START_DOCKER=false
      - HARDEN_DESKTOP=true
      - RESTART_APP=false
      - NO_DECOR=true
      - NO_FULL=true
      - DISABLE_IPV6=true
      - CHROME_CLI=--disable-background-networking --disable-component-update --disable-default-apps --disable-extensions --disable-features=MediaRouter,OptimizationHints,Translate --disable-sync --no-default-browser-check --no-first-run --password-store=basic
    ports:
      - "38481:3001"
      - "38482:3000"
    volumes:
      - ./data/chromium:/config
    networks:
      - portal-net

  guacamole-db:
    image: postgres:latest
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${GUACAMOLE_POSTGRES_DB-guacamole_db}
      - POSTGRES_USER=${GUACAMOLE_POSTGRES_USER-guacamole_user}
      - POSTGRES_PASSWORD=${GUACAMOLE_POSTGRES_PASSWORD-change-me-guacdb}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${GUACAMOLE_POSTGRES_USER-guacamole_user} -d ${GUACAMOLE_POSTGRES_DB-guacamole_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - ./data/guacamole-postgres:/var/lib/postgresql/data
    networks:
      - portal-net

  guacamole-db-init:
    image: postgres:latest
    restart: "no"
    depends_on:
      guacamole-db:
        condition: service_healthy
    environment:
      - POSTGRES_DB=${GUACAMOLE_POSTGRES_DB-guacamole_db}
      - POSTGRES_USER=${GUACAMOLE_POSTGRES_USER-guacamole_user}
      - PGPASSWORD=${GUACAMOLE_POSTGRES_PASSWORD-change-me-guacdb}
    command:
      - /bin/sh
      - -ec
      - |
        until pg_isready -h guacamole-db -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"; do
          sleep 2
        done

        if psql -h guacamole-db -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -tAc "SELECT 1 FROM information_schema.tables WHERE table_schema = 'public' AND table_name = 'guacamole_user'" | grep -q 1; then
          echo "Guacamole schema already present; skipping init."
          exit 0
        fi

        wget -qO /tmp/001-create-schema.sql https://raw.githubusercontent.com/apache/guacamole-client/master/extensions/guacamole-auth-jdbc/modules/guacamole-auth-jdbc-postgresql/schema/001-create-schema.sql
        wget -qO /tmp/002-create-admin-user.sql https://raw.githubusercontent.com/apache/guacamole-client/master/extensions/guacamole-auth-jdbc/modules/guacamole-auth-jdbc-postgresql/schema/002-create-admin-user.sql

        psql -h guacamole-db -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -f /tmp/001-create-schema.sql
        psql -h guacamole-db -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -f /tmp/002-create-admin-user.sql
    networks:
      - portal-net

  guacd:
    image: guacamole/guacd:latest
    restart: unless-stopped
    networks:
      - portal-net

  guacamole:
    image: guacamole/guacamole:latest
    restart: unless-stopped
    depends_on:
      guacamole-db:
        condition: service_healthy
      guacamole-db-init:
        condition: service_completed_successfully
      guacd:
        condition: service_started
    environment:
      - GUACD_HOSTNAME=guacd
      - POSTGRESQL_HOSTNAME=guacamole-db
      - POSTGRESQL_DATABASE=${GUACAMOLE_POSTGRES_DB-guacamole_db}
      - POSTGRESQL_USERNAME=${GUACAMOLE_POSTGRES_USER-guacamole_user}
      - POSTGRESQL_PASSWORD=${GUACAMOLE_POSTGRES_PASSWORD-change-me-guacdb}
    networks:
      - portal-net

networks:
  portal-net:
    name: portal-net
